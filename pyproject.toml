[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stalk"
version = "0.1.0"
description = "Search for Technosignature Anomalies in LightKurves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stefano Dolci", email = "s.dolci5@campus.unimib.it" }
]
keywords = ["astronomy", "exoplanets", "SETI", "technosignature", "transit", "lightcurve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "lightkurve>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/StefanoDolci/STALK"
Repository = "https://github.com/StefanoDolci/STALK"

[tool.setuptools.packages.find]
where = ["src"]
